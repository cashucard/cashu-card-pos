# Slice 1.3: as app-text, waiting up to 300 s (a settle the library holds back 60 s, or the 3 minute timer). ID; TEXT; NAME.
appId: org.cashucard.pos
---
- extendedWaitUntil:
    visible:
      id: "${ID}"
    timeout: 300000
- assertVisible:
    id: "${ID}"
    text: "${TEXT}"
- takeScreenshot: ${NAME}
